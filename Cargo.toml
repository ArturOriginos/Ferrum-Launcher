[package]
name = "ferrum-launcher"
version = "0.9.1"
authors = ["ArturOriginos"]
edition = "2021"
description = "Minecraft launcher written in Rust: instances, RAM, mods from Modrinth and CurseForge, temporary accounts"
license = "MIT"
repository = "https://github.com/ArturOriginos/ferrum-launcher"
readme = "README.md"

[dependencies]
anyhow = "1"
directories = "5"
eframe = "0.29"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "0.10"
rand = "0.8"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = "0.32"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
